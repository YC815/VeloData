            - paragraph: TSS（訓練壓力分數）
            - paragraph: 這趟騎乘「讓你多累」的總量。100 分大約等於全力騎一小時的疲勞感。騎完 < 50 隔天沒問題；150+ 需要認真休息。
          - generic:
            - paragraph: NP（標準化功率）
            - paragraph: 比均瓦更誠實的強度數字。市區走走停停均瓦看起來低，但 NP 會抓出你那幾腳猛踩對身體的真實傷害。NP 比均瓦高越多，代表騎乘越不穩定。
          - generic:
            - paragraph: IF（強度因子）
            - paragraph: 這趟騎乘有多「硬」，以你的 FTP 為基準。0.75 以下輕鬆恢復騎、0.85–0.95 甜區訓練、1.0 以上就是在逼極限。
