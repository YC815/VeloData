<!-- Event Manager：賽事管理清單 -->
<div id="event-manager-section" class="mt-8">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-sm font-semibold text-slate-200 tracking-wide">賽事管理</h2>
    <span class="text-[10px] uppercase tracking-widest text-slate-600 font-mono">Event Manager</span>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">

    <!-- 新增表單 -->
    <div class="p-5 border-b border-slate-800">
      <p class="text-xs text-slate-500 mb-4">手動錄入報名賽事，A 級賽事會顯示在上方倒數卡片</p>
      <form id="event-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

        <div class="sm:col-span-2 lg:col-span-1">
          <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1.5 font-mono">賽事名稱</label>
          <input type="text" id="event-name" placeholder="例：武嶺單車節"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-600
                   focus:outline-none focus:border-orange-500/60 focus:bg-slate-800 transition-colors">
        </div>

        <div>
          <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1.5 font-mono">日期</label>
          <input type="date" id="event-date"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200
                   focus:outline-none focus:border-orange-500/60 transition-colors
                   [color-scheme:dark]">
        </div>

        <div>
          <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1.5 font-mono">優先級</label>
          <select id="event-priority"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200
                   focus:outline-none focus:border-orange-500/60 transition-colors">
            <option value="A">A 級 — 主要目標</option>
            <option value="B">B 級 — 次要目標</option>
            <option value="C">C 級 — 練兵/訓練賽</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1.5 font-mono">總距離 (km)</label>
          <input type="number" id="event-distance" placeholder="120" min="0" step="0.1"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-600
                   focus:outline-none focus:border-orange-500/60 transition-colors">
        </div>

        <div>
          <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1.5 font-mono">總爬升 (m)</label>
          <input type="number" id="event-elevation" placeholder="2593" min="0" step="1"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-600
                   focus:outline-none focus:border-orange-500/60 transition-colors">
        </div>

        <div class="flex items-end">
          <button type="submit"
            class="w-full flex items-center justify-center gap-2 bg-orange-500 hover:bg-orange-400 active:bg-orange-600
                   text-white text-sm font-semibold rounded-lg px-4 py-2 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
            新增賽事
          </button>
        </div>
      </form>

      <!-- 錯誤提示 -->
      <div id="event-form-error" class="hidden mt-3 flex items-center gap-2 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2">
        <svg class="w-3.5 h-3.5 text-red-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
        </svg>
        <p id="event-form-error-text" class="text-xs text-red-400"></p>
      </div>
    </div>

    <!-- 賽事清單 -->
    <div id="event-list-container" class="divide-y divide-slate-800">
      <!-- 由 JS 動態渲染 -->
    </div>

    <!-- 空態 -->
    <div id="event-list-empty" class="hidden px-5 py-8 text-center">
      <p class="text-slate-600 text-sm">尚未新增任何賽事</p>
    </div>

  </div>
</div>

<script>
(function () {
  function daysUntil(dateStr) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / (1000 * 60 * 60 * 24));
  }

  function priorityBadge(p) {
    const styles = {
      A: 'bg-orange-500/20 text-orange-400 border border-orange-500/30',
      B: 'bg-blue-500/20 text-blue-400 border border-blue-500/30',
      C: 'bg-slate-700 text-slate-400',
    };
    return `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded font-mono ${styles[p] || styles.C}">${p}</span>`;
  }

  function countdownBadge(days) {
    if (days < 0) return `<span class="text-[10px] font-mono text-slate-600">已結束</span>`;
    if (days === 0) return `<span class="text-[10px] font-mono text-red-400 font-bold">今天！</span>`;
    if (days <= 7) return `<span class="text-[10px] font-mono text-orange-400 font-bold">${days}天後</span>`;
    if (days <= 30) return `<span class="text-[10px] font-mono text-yellow-400">${days}天後</span>`;
    return `<span class="text-[10px] font-mono text-slate-500">${days}天後</span>`;
  }

  function renderList(events) {
    const container = document.getElementById('event-list-container');
    const empty = document.getElementById('event-list-empty');

    if (!events.length) {
      container.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    container.innerHTML = events.map(ev => {
      const days = daysUntil(ev.date);
      const dateFormatted = new Date(ev.date + 'T00:00:00').toLocaleDateString('zh-TW', {month: 'numeric', day: 'numeric'});
      const isPast = days < 0;
      return `
        <div class="flex items-center justify-between px-5 py-3.5 ${isPast ? 'opacity-40' : ''}">
          <div class="flex items-center gap-3 min-w-0">
            ${priorityBadge(ev.priority)}
            <div class="min-w-0">
              <p class="text-sm text-slate-200 font-medium truncate">${ev.name}</p>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-[10px] text-slate-600">${dateFormatted}</span>
                ${ev.distance_km ? `<span class="text-[10px] text-slate-600">${ev.distance_km} km</span>` : ''}
                ${ev.elevation_m ? `<span class="text-[10px] text-slate-600">${ev.elevation_m} m ↑</span>` : ''}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-3 flex-shrink-0 ml-4">
            ${countdownBadge(days)}
            <button onclick="deleteEvent(${ev.id})"
              class="text-slate-700 hover:text-red-400 transition-colors p-1 rounded">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
              </svg>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function showError(msg) {
    const errEl = document.getElementById('event-form-error');
    const errText = document.getElementById('event-form-error-text');
    errText.textContent = msg;
    errEl.classList.remove('hidden');
  }

  function hideError() {
    document.getElementById('event-form-error').classList.add('hidden');
  }

  function loadAndRender() {
    fetch('/api/events')
      .then(r => r.json())
      .then(data => renderList(Array.isArray(data) ? data : []))
      .catch(() => renderList([]));
  }

  window.deleteEvent = function(id) {
    fetch(`/api/events/${id}`, { method: 'DELETE' })
      .then(r => r.json())
      .then(() => loadAndRender())
      .catch(() => showError('刪除失敗，請重試'));
  };

  document.getElementById('event-form').addEventListener('submit', function(e) {
    e.preventDefault();
    hideError();

    const name = document.getElementById('event-name').value.trim();
    const date = document.getElementById('event-date').value;
    const priority = document.getElementById('event-priority').value;
    const distance = document.getElementById('event-distance').value;
    const elevation = document.getElementById('event-elevation').value;

    if (!name) { showError('請輸入賽事名稱'); return; }
    if (!date) { showError('請選擇賽事日期'); return; }

    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;

    fetch('/api/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        date,
        priority,
        distance_km: distance || null,
        elevation_m: elevation || null,
      }),
    })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) { showError(data.error || '新增失敗'); return; }
        document.getElementById('event-name').value = '';
        document.getElementById('event-date').value = '';
        document.getElementById('event-distance').value = '';
        document.getElementById('event-elevation').value = '';
        loadAndRender();
      })
      .catch(() => showError('網路錯誤，請重試'))
      .finally(() => { btn.disabled = false; });
  });

  loadAndRender();
})();
</script>
