<div class="bg-zinc-900 p-5 rounded-2xl border border-white/8 relative overflow-hidden">
  <!-- TSB 狀態光暈 -->
  <div class="absolute -top-8 -right-8 w-24 h-24 rounded-full blur-2xl opacity-20 pointer-events-none
    {% if pmc.current_tsb >= 0 %}bg-emerald-500{% else %}bg-rose-500{% endif %}"></div>

  <h3 class="text-zinc-400 text-xs uppercase tracking-widest mb-3">訓練狀態</h3>

  <div class="flex items-center gap-2 mb-2">
    <div class="w-3 h-3 rounded-full {{ tsb_status.tw_class }} flex-shrink-0"></div>
    <span class="text-2xl font-black font-mono
      {% if pmc.current_tsb >= 5 %}text-emerald-400 tsb-positive
      {% elif pmc.current_tsb >= 0 %}text-zinc-200
      {% elif pmc.current_tsb >= -20 %}text-amber-400
      {% else %}text-rose-400 tsb-negative{% endif %}">
      {% if pmc.current_tsb > 0 %}+{% endif %}{{ pmc.current_tsb }}
    </span>
    <span class="text-xs text-zinc-500">TSB</span>
  </div>

  <p class="text-xs text-zinc-400 mb-4">{{ tsb_status.label }}</p>

  <div class="flex gap-2 flex-wrap">
    <span class="bg-cyan-950/40 border border-cyan-900/30 text-cyan-400 ctl-value text-xs px-2 py-0.5 rounded-full font-mono">
      CTL {{ pmc.current_ctl }}
    </span>
    <span class="bg-orange-950/40 border border-orange-900/30 text-orange-500 atl-value text-xs px-2 py-0.5 rounded-full font-mono">
      ATL {{ pmc.current_atl }}
    </span>
  </div>
</div>
