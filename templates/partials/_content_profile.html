  <div class="max-w-2xl space-y-6">

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h3 class="text-slate-400 text-xs uppercase tracking-widest mb-4">Strava 連線</h3>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          {% if athlete.profile %}
          <img src="{{ athlete.profile }}" class="w-10 h-10 rounded-full border border-orange-500/60 object-cover" />
          {% else %}
          <div class="w-10 h-10 rounded-full border border-orange-500/60 bg-slate-800 flex items-center justify-center">
            <svg class="w-5 h-5 text-slate-400" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
          {% endif %}
          <div>
            <div class="text-slate-200 font-semibold">{{ athlete.firstname }} {{ athlete.lastname }}</div>
            <span class="text-xs text-green-400">已連線</span>
          </div>
        </div>
        <a href="{{ url_for('auth') }}" class="text-xs text-slate-500 hover:text-orange-400 transition">重新授權</a>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h3 class="text-slate-400 text-xs uppercase tracking-widest mb-4">訓練參數</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-widest mb-1.5">FTP（瓦特）</label>
          <div class="relative">
            <input id="profileFtpInput" type="number" min="1" max="600" value="{{ ftp }}"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 font-mono text-lg focus:outline-none focus:border-orange-500 transition pr-12" />
            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">W</span>
          </div>
          <p class="text-xs text-slate-600 mt-1">功能臨界功率，用於 TSS / IF 計算</p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-widest mb-1.5">體重（公斤）</label>
          <div class="relative">
            <input id="profileWeightInput" type="number" min="1" max="200" step="0.1" value="{{ weight_kg }}"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 font-mono text-lg focus:outline-none focus:border-orange-500 transition pr-14" />
            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">kg</span>
          </div>
          <p class="text-xs text-slate-600 mt-1">用於 W/kg 與武嶺時間預測</p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-widest mb-1.5">車重（公斤）</label>
          <div class="relative">
            <input id="profileBikeWeightInput" type="number" min="1" max="30" step="0.1" value="{{ bike_weight_kg }}"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 font-mono text-lg focus:outline-none focus:border-orange-500 transition pr-14" />
            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">kg</span>
          </div>
          <p class="text-xs text-slate-600 mt-1">含輪組、水壺架、補給等配件，預測時系統重 = 體重 + 車重</p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-widest mb-1.5">時區</label>
          <select id="profileTimezoneSelect"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-orange-500 transition">
            {% if used_timezones %}
            <optgroup label="曾使用的時區">
              {% for tz in used_timezones %}
              <option value="{{ tz }}" {% if tz == timezone %}selected{% endif %}>{{ tz }}</option>
              {% endfor %}
            </optgroup>
            {% endif %}
            <optgroup label="所有時區">
              {% for tz in all_timezones %}
              <option value="{{ tz }}" {% if tz == timezone and tz not in used_timezones %}selected{% endif %}>{{ tz }}</option>
              {% endfor %}
            </optgroup>
          </select>
          <p class="text-xs text-slate-600 mt-1">影響本週統計與 PMC 圖表的日期邊界</p>
        </div>
      </div>
      <div class="mt-6">
        <button id="profileSaveBtn" onclick="saveProfileSettings()"
          class="w-full py-2.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-white font-semibold text-sm transition disabled:opacity-50">
          儲存設定
        </button>
        <div id="profileSaveMsg" class="hidden mt-3 text-center text-sm text-green-400">已儲存，重新整理後生效</div>
        <div id="profileSaveErr" class="hidden mt-3 text-center text-sm text-red-400"></div>
      </div>
    </div>

    <div class="bg-slate-900/40 border border-slate-800 border-dashed rounded-2xl p-6">
      <h3 class="text-slate-400 text-xs uppercase tracking-widest mb-2">裝置設定</h3>
      <p class="text-slate-600 text-sm">功率計裝置設定開發中</p>
    </div>

  </div>
  <script>
    async function saveProfileSettings() {
      const btn = document.getElementById('profileSaveBtn');
      const msg = document.getElementById('profileSaveMsg');
      const err = document.getElementById('profileSaveErr');
      msg.classList.add('hidden');
      err.classList.add('hidden');

      const ftp = parseInt(document.getElementById('profileFtpInput').value);
      const weight = parseFloat(document.getElementById('profileWeightInput').value);
      const bikeWeight = parseFloat(document.getElementById('profileBikeWeightInput').value);
      const tz = document.getElementById('profileTimezoneSelect').value;

      if (!ftp || ftp <= 0 || ftp > 600) {
        err.textContent = 'FTP 請輸入 1–600 之間的數值';
        err.classList.remove('hidden');
        return;
      }
      if (!weight || weight <= 0 || weight > 200) {
        err.textContent = '體重請輸入 1–200 之間的數值';
        err.classList.remove('hidden');
        return;
      }
      if (!bikeWeight || bikeWeight <= 0 || bikeWeight > 30) {
        err.textContent = '車重請輸入 1–30 之間的數值';
        err.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = '儲存中…';
      try {
        const res = await fetch('/api/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ftp_watts: ftp, weight_kg: weight, bike_weight_kg: bikeWeight, timezone: tz }),
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || '儲存失敗');
        }
        msg.classList.remove('hidden');
        setTimeout(() => location.reload(), 900);
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = '儲存設定';
      }
    }
  </script>
