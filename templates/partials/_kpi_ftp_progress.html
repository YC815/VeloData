<div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
  <h3 class="text-slate-400 text-xs uppercase tracking-widest mb-3">FTP 進度</h3>
  <div class="flex items-baseline gap-2 mb-3">
    <span class="text-2xl font-black text-orange-400 font-mono">{{ ftp_progress.current }}W</span>
    <span class="text-slate-500 text-sm">→ {{ ftp_progress.target }}W</span>
  </div>
  <div class="w-full bg-slate-800 rounded-full h-2 mb-3">
    <div class="bg-orange-500 h-2 rounded-full transition-all" style="width: {{ ftp_progress.progress_pct }}%"></div>
  </div>
  <div class="flex items-center justify-between">
    <span class="text-xs text-slate-500">{{ ftp_progress.progress_pct }}% 達成</span>
    {% if ftp_progress.w_per_kg %}
    <span class="bg-slate-800 text-cyan-400 font-mono text-xs px-2 py-0.5 rounded-full">
      {{ ftp_progress.w_per_kg }} W/kg
    </span>
    {% endif %}
  </div>
</div>
