<div id="settingsModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeSettings()"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-sm px-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-6">

      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          {% if athlete.profile %}
          <img src="{{ athlete.profile }}" class="w-9 h-9 rounded-full border border-orange-500/60 object-cover" />
          {% endif %}
          <div>
            <div class="text-slate-200 font-semibold text-sm">{{ athlete.firstname }} {{ athlete.lastname }}</div>
            <div class="text-xs text-slate-500">帳號設定</div>
          </div>
        </div>
        <button onclick="closeSettings()" class="text-slate-500 hover:text-slate-300 transition p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-widest mb-1.5">FTP（瓦特）</label>
          <div class="relative">
            <input
              id="ftpInput"
              type="number"
              min="1"
              max="600"
              value="{{ ftp }}"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 font-mono text-lg focus:outline-none focus:border-orange-500 transition pr-12"
            />
            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">W</span>
          </div>
          <p class="text-xs text-slate-600 mt-1">功能臨界功率，用於 TSS / IF 計算</p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-widest mb-1.5">體重（公斤）</label>
          <div class="relative">
            <input
              id="weightInput"
              type="number"
              min="1"
              max="200"
              step="0.1"
              value="{{ weight_kg }}"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 font-mono text-lg focus:outline-none focus:border-orange-500 transition pr-14"
            />
            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">kg</span>
          </div>
          <p class="text-xs text-slate-600 mt-1">用於 W/kg 與武嶺時間預測</p>
        </div>
        <div>
          <label class="block text-xs text-slate-400 uppercase tracking-widest mb-1.5">時區</label>
          <select
            id="timezoneSelect"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-orange-500 transition"
          >
            {% if used_timezones %}
            <optgroup label="曾使用的時區">
              {% for tz in used_timezones %}
              <option value="{{ tz }}" {% if tz == timezone %}selected{% endif %}>{{ tz }}</option>
              {% endfor %}
            </optgroup>
            {% endif %}
            <optgroup label="所有時區">
              {% for tz in all_timezones %}
              <option value="{{ tz }}" {% if tz == timezone and tz not in used_timezones %}selected{% endif %}>{{ tz }}</option>
              {% endfor %}
            </optgroup>
          </select>
          <p class="text-xs text-slate-600 mt-1">影響本週統計與 PMC 圖表的日期邊界</p>
        </div>
      </div>

      <div class="mt-6 flex gap-3">
        <button
          onclick="closeSettings()"
          class="flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-400 text-sm hover:text-slate-200 hover:border-slate-600 transition"
        >取消</button>
        <button
          id="saveBtn"
          onclick="saveSettings()"
          class="flex-2 flex-grow py-2.5 rounded-xl bg-orange-500 hover:bg-orange-400 text-white font-semibold text-sm transition disabled:opacity-50"
        >儲存</button>
      </div>
      <div id="saveMsg" class="hidden mt-3 text-center text-sm text-green-400">已儲存，重新整理後生效</div>
      <div id="saveErr" class="hidden mt-3 text-center text-sm text-red-400"></div>
    </div>
  </div>
</div>
