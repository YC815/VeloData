<header class="mb-10 flex justify-between items-end">
  <div>
    <h1 class="text-4xl font-black text-orange-500 tracking-tighter">VeloData</h1>
    <p class="text-slate-400">防止資科被當的單車數據外掛</p>
  </div>
  <div class="flex items-center gap-3">
    <button
      id="copyAiBtn"
      onclick="copyForAI()"
      title="複製訓練摘要給 AI"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 hover:border-orange-500/50 text-slate-300 hover:text-orange-300 text-xs font-medium transition group"
    >
      <svg id="copyAiIcon" class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>
      <span id="copyAiLabel">複製訓練摘要</span>
    </button>
    <div class="text-right">
      <div class="text-slate-200 font-semibold leading-tight">
        {{ athlete.firstname }} {{ athlete.lastname }}
      </div>
      <span class="text-xs text-green-400">已連線 Strava</span>
    </div>
    <button
      id="avatarBtn"
      onclick="openSettings()"
      class="relative group focus:outline-none"
      title="帳號設定"
    >
      {% if athlete.profile %}
      <img
        src="{{ athlete.profile }}"
        alt="{{ athlete.firstname }} {{ athlete.lastname }}"
        class="w-10 h-10 rounded-full border-2 border-orange-500 object-cover transition group-hover:border-orange-300 group-hover:scale-105"
      />
      {% else %}
      <div class="w-10 h-10 rounded-full border-2 border-orange-500 bg-slate-800 flex items-center justify-center transition group-hover:border-orange-300">
        <svg class="w-5 h-5 text-slate-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      {% endif %}
      <span class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-slate-900 rounded-full flex items-center justify-center">
        <svg class="w-2.5 h-2.5 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </span>
    </button>
  </div>
</header>
