<header class="mb-10 flex justify-between items-end">
  <div>
    <h1 class="text-4xl font-black text-orange-500 tracking-tighter">VeloData</h1>
    <p class="text-zinc-400">防止資科被當的單車數據外掛</p>
  </div>
  <div class="flex items-center gap-3">
    <button
      id="refreshDataBtn"
      title="從 Strava 重新抓取最新資料"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-zinc-800 border border-white/10 hover:bg-zinc-700 hover:border-orange-500/50 text-zinc-300 hover:text-orange-300 text-xs font-medium transition"
      onclick="refreshActivityData()"
    >
      <svg id="refreshIcon" class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <span id="refreshLabel">刷新資料</span>
    </button>
    <button
      id="copyAiBtn"
      onclick="copyForAI()"
      title="複製訓練摘要給 AI"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-zinc-800 border border-white/10 hover:bg-zinc-700 hover:border-orange-500/50 text-zinc-300 hover:text-orange-300 text-xs font-medium transition group"
    >
      <svg id="copyAiIcon" class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>
      <span id="copyAiLabel">複製訓練摘要</span>
    </button>
    <div class="text-right">
      <div class="text-zinc-200 font-semibold leading-tight">
        {{ athlete.firstname }} {{ athlete.lastname }}
      </div>
      <span class="text-xs text-green-400">已連線 Strava</span>
    </div>
    <div id="avatarBtn" class="relative">
      {% if athlete.profile %}
      <img
        src="{{ athlete.profile }}"
        alt="{{ athlete.firstname }} {{ athlete.lastname }}"
        class="w-10 h-10 rounded-full border-2 border-orange-500 object-cover"
      />
      {% else %}
      <div class="w-10 h-10 rounded-full border-2 border-orange-500 bg-zinc-800 flex items-center justify-center">
        <svg class="w-5 h-5 text-zinc-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      {% endif %}
    </div>
  </div>
</header>
<script>
  function _updateCacheTimeLabel(cachedAt) {
    var btn = document.getElementById('refreshDataBtn');
    if (btn) btn.title = cachedAt ? '資料時間 ' + cachedAt + '（點擊重新抓取）' : '從 Strava 重新抓取最新資料';
  }

  function _getActiveTabUrl() {
    var active = document.querySelector('#navTabs .nav-tab.active');
    return active ? active.getAttribute('hx-get') : '/partials/dashboard';
  }

  function refreshActivityData() {
    var btn = document.getElementById('refreshDataBtn');
    var icon = document.getElementById('refreshIcon');
    var label = document.getElementById('refreshLabel');
    if (!btn) return;

    btn.disabled = true;
    label.textContent = '更新中…';
    icon.classList.add('animate-spin');

    fetch('/api/activities/refresh', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.cached_at) _updateCacheTimeLabel(data.cached_at);
        var url = _getActiveTabUrl();
        htmx.ajax('GET', url, { target: '#content', swap: 'innerHTML' });
      })
      .catch(function() {
        label.textContent = '刷新失敗';
      })
      .finally(function() {
        btn.disabled = false;
        label.textContent = '刷新資料';
        icon.classList.remove('animate-spin');
      });
  }

  // 頁面載入時取得目前緩存時間
  fetch('/api/activities/cache-info')
    .then(function(r) { return r.json(); })
    .then(function(d) { _updateCacheTimeLabel(d.cached_at); })
    .catch(function() {});
</script>
