<div id="ftpSuggestCard" class="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl mb-6 overflow-hidden">

  <!-- 收合列（永遠可見）-->
  <button
    onclick="ftpSuggestToggle()"
    class="w-full flex items-center justify-between px-5 py-3.5 hover:bg-slate-800/50 transition text-left gap-3"
  >
    <div class="flex items-center gap-3 min-w-0">
      <span class="text-sm font-semibold text-slate-300 shrink-0">FTP 估算</span>
      <span id="ftpSuggestBadge" class="text-sm font-mono text-slate-300 truncate">—</span>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <span id="ftpWperKgBadge" class="hidden text-xs font-mono text-cyan-400 bg-cyan-950/40 border border-cyan-900/40 px-2 py-0.5 rounded-full"></span>
      <span id="ftpSuggestTimestamp" class="text-xs text-slate-600 hidden sm:block"></span>
      <svg id="ftpSuggestChevron" class="w-4 h-4 text-slate-500 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </button>

  <!-- 展開面板-->
  <div id="ftpSuggestPanel" class="hidden border-t border-slate-800 p-5">

    <!-- 主數值列-->
    <div id="ftpSuggestResult" class="hidden mb-4">
      <div class="grid grid-cols-5 gap-3 mb-4">
        <div class="col-span-2 bg-orange-950/30 border border-orange-900/40 rounded-xl p-3 text-center">
          <div class="text-xs text-slate-500 mb-1">目前 FTP</div>
          <div id="ftpCurrentVal" class="text-2xl font-mono font-bold text-orange-200">—</div>
          <div class="text-xs text-slate-600 mt-0.5">W</div>
        </div>
        <div id="ftpFinalCell" class="col-span-2 bg-slate-800/60 rounded-xl p-3 text-center">
          <div class="text-xs text-slate-500 mb-1">建議 FTP</div>
          <div id="ftpFinalVal" class="text-2xl font-mono font-bold text-slate-300">—</div>
          <div class="text-xs text-slate-600 mt-0.5">W</div>
        </div>
        <div id="ftpDeltaCell" class="col-span-1 bg-slate-800/60 rounded-xl p-3 text-center">
          <div class="text-xs text-slate-500 mb-1">差值</div>
          <div id="ftpDeltaVal" class="text-2xl font-mono font-bold">—</div>
          <div class="text-xs text-slate-600 mt-0.5">W</div>
        </div>
      </div>

      <!-- 子模型明細-->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
        <div class="bg-slate-800/40 rounded-xl p-3">
          <div class="text-xs text-slate-500 mb-1.5">MMP 近似</div>
          <div id="ftpMmpVal" class="text-base font-mono font-semibold text-slate-200 mb-1">—</div>
          <div id="ftpMmpBasis" class="text-xs text-slate-500 leading-relaxed"></div>
        </div>
        <div class="bg-slate-800/40 rounded-xl p-3">
          <div class="flex items-center justify-between mb-1.5">
            <div class="text-xs text-slate-500">物理逆推</div>
            <button
              onclick="ftpPhysToggle()"
              class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-400 hover:text-slate-200 text-xs transition"
            >
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
              </svg>
              <span>設定</span>
            </button>
          </div>
          <div id="ftpPhysVal" class="text-base font-mono font-semibold text-slate-200 mb-1">—</div>
          <div id="ftpPhysBasis" class="text-xs text-slate-500 leading-relaxed"></div>
          <div id="ftpPhysPanel" class="hidden mt-3 pt-3 border-t border-slate-700 space-y-1.5">
            <select id="ftpPhysActivitySelect" class="w-full bg-slate-700 border border-slate-600 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:border-orange-500 transition">
              <option value="">選擇活動…</option>
            </select>
            <select id="ftpPhysRouteSelect" class="w-full bg-slate-700 border border-slate-600 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:border-orange-500 transition">
              <option value="">選擇路段…</option>
            </select>
            <button id="ftpPhysRunBtn" onclick="ftpPhysicsRun()" disabled
              class="flex items-center gap-1.5 w-full justify-center px-3 py-1.5 rounded-lg bg-slate-600 hover:bg-slate-500 text-slate-200 text-xs font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
              <svg id="ftpPhysSpinner" class="hidden w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
              </svg>
              <span id="ftpPhysRunLabel">逆推</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 無資料提示-->
    <div id="ftpSuggestEmpty" class="hidden text-sm text-slate-500 text-center py-3 mb-4">
      90 天內無足夠功率資料，無法估算 FTP。
    </div>

    <!-- 操作按鈕列-->
    <div class="flex flex-wrap gap-2 items-center">
      <button id="ftpSuggestBtn" onclick="ftpSuggestRun()"
        class="flex items-center gap-2 px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-white text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
        <svg id="ftpSuggestSpinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span id="ftpSuggestBtnLabel">估算 FTP</span>
      </button>
      <button id="ftpApplyBtn" onclick="ftpSuggestApply()" disabled
        class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
        套用建議值
      </button>
      <button id="ftpCopyBtn" onclick="ftpSuggestCopy()" disabled
        class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
        </svg>
        <span id="ftpCopyBtnLabel">複製給 AI</span>
      </button>

      <!-- tooltip -->
      <div class="relative group ml-auto">
        <div class="w-5 h-5 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center cursor-help text-slate-400 text-xs font-bold hover:bg-slate-600 transition">?</div>
        <div class="absolute right-0 bottom-7 w-80 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-xs text-slate-300 leading-relaxed shadow-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-10">
          <div class="space-y-2.5">
            <div>
              <p class="font-semibold text-slate-100 mb-0.5">MMP 近似模型</p>
              <p>從近 90 天有功率計的 15–40 分鐘騎乘中，找出最高 NP，套用換算係數（20min × 0.95、30min × 0.97）推算 FTP。</p>
            </div>
            <div class="border-t border-slate-700 pt-2.5">
              <p class="font-semibold text-slate-100 mb-0.5">物理逆推模型</p>
              <p>指定一筆活動與路段，逆推出「跑出該成績所需的 FTP」，排除設備誤差。</p>
            </div>
            <div class="border-t border-slate-700 pt-2.5">
              <p class="font-semibold text-slate-100 mb-0.5">加權合成</p>
              <p>兩模型同時有結果時：<span class="font-mono text-orange-300">MMP × 60% + 物理 × 40%</span>。</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
