<div id="ftpSuggestCard" class="bg-zinc-900 rounded-2xl border border-white/8 mb-6 overflow-hidden">

  <!-- 收合列 -->
  <button
    onclick="ftpSuggestToggle()"
    class="w-full flex items-center justify-between px-5 py-4 hover:bg-zinc-800/40 transition-colors text-left group"
  >
    <div class="flex items-center gap-3 min-w-0">
      <span class="text-sm font-semibold text-zinc-200">FTP 估算</span>
      <span id="ftpHeaderBadge" class="text-xs font-mono text-zinc-400 truncate"></span>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span id="ftpWperKgBadge" class="hidden text-xs font-mono text-cyan-400 bg-cyan-950/40 border border-cyan-900/40 px-2 py-0.5 rounded-full"></span>
      <span id="ftpSuggestTimestamp" class="hidden text-[10px] text-zinc-500 font-mono"></span>
      <svg id="ftpSuggestChevron" class="w-4 h-4 text-zinc-400 group-hover:text-zinc-300 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </button>

  <!-- 展開面板 -->
  <div id="ftpSuggestPanel" class="hidden border-t border-white/6">

    <!-- 動態主值區（由 JS 依狀態渲染） -->
    <div id="ftpValuesSection" class="border-b border-white/6">
      <!-- 預設狀態 A：尚未估算 -->
      <div class="px-6 py-6">
        <div class="flex items-baseline gap-2 mb-1.5">
          <span class="text-5xl font-black font-mono text-zinc-100">{{ ftp }}</span>
          <span class="text-sm text-zinc-400 font-mono">W</span>
        </div>
        <p class="text-[10px] text-zinc-400 uppercase tracking-wider font-mono">目前 FTP</p>
        <p class="text-xs text-zinc-500 mt-3 leading-relaxed">分析近 90 天功率資料，推算更準確的 FTP</p>
      </div>
    </div>

    <!-- 子模型區（狀態 B / C 才顯示） -->
    <div id="ftpSubmodels" class="hidden">
      <div class="grid grid-cols-1 sm:grid-cols-2 divide-y sm:divide-y-0 sm:divide-x divide-white/6 border-b border-white/6">

        <!-- MMP 近似 -->
        <div class="px-5 py-4">
          <p class="text-[10px] text-zinc-400 uppercase tracking-wider font-mono mb-2">MMP 近似</p>
          <p id="ftpMmpVal" class="text-base font-mono font-semibold text-zinc-100 leading-none">—</p>
          <p id="ftpMmpBasis" class="text-xs text-zinc-400 leading-relaxed mt-1.5"></p>
        </div>

        <!-- 物理逆推 + 控制項（直接展示，不再藏在「設定」後） -->
        <div class="px-5 py-4">
          <p class="text-[10px] text-zinc-400 uppercase tracking-wider font-mono mb-2">物理逆推</p>
          <p id="ftpPhysVal" class="text-base font-mono font-semibold text-zinc-100 leading-none">—</p>
          <p id="ftpPhysBasis" class="text-xs text-zinc-400 leading-relaxed mt-1.5 mb-3"></p>
          <div class="space-y-1.5">
            <select id="ftpPhysActivitySelect"
              class="w-full bg-zinc-800 border border-white/8 text-zinc-300 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-orange-500/60 transition-colors">
              <option value="">選擇活動…</option>
            </select>
            <select id="ftpPhysRouteSelect"
              class="w-full bg-zinc-800 border border-white/8 text-zinc-300 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-orange-500/60 transition-colors">
              <option value="">選擇路段…</option>
            </select>
            <button id="ftpPhysRunBtn" onclick="ftpPhysicsRun()" disabled
              class="flex items-center gap-1.5 w-full justify-center px-3 py-1.5 rounded-lg
                     bg-zinc-700 border border-white/8 hover:bg-zinc-600 hover:border-white/15
                     text-zinc-200 text-xs font-medium transition-all
                     disabled:opacity-40 disabled:cursor-not-allowed">
              <svg id="ftpPhysSpinner" class="hidden w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
              </svg>
              <span id="ftpPhysRunLabel">逆推</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- 操作按鈕列 -->
    <div class="px-5 py-3 flex items-center gap-2 flex-wrap">

      <!-- 估算 / 重新運算（永遠可見） -->
      <button id="ftpSuggestBtn" onclick="ftpSuggestRun()"
        class="flex items-center gap-2 px-4 py-2 rounded-lg
               bg-orange-500 hover:bg-orange-400 active:bg-orange-600
               text-white text-sm font-medium transition-all
               shadow-sm shadow-orange-500/20 hover:shadow-orange-500/30 hover:-translate-y-px
               disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none disabled:translate-y-0">
        <svg id="ftpSuggestSpinner" class="hidden w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span id="ftpSuggestBtnLabel">估算 FTP</span>
      </button>

      <!-- 套用建議值（狀態 B 才顯示） -->
      <div id="ftpApplyWrap" class="hidden">
        <button id="ftpApplyBtn" onclick="ftpSuggestApply()"
          class="px-4 py-2 rounded-lg bg-zinc-800 border border-white/8
                 hover:bg-zinc-700 hover:border-white/15
                 text-zinc-300 hover:text-zinc-100 text-sm font-medium transition-all
                 disabled:opacity-40 disabled:cursor-not-allowed">
          套用建議值
        </button>
      </div>

      <!-- 複製給 AI（狀態 B / C 才顯示） -->
      <div id="ftpCopyWrap" class="hidden">
        <button id="ftpCopyBtn" onclick="ftpSuggestCopy()"
          class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-zinc-800 border border-white/8
                 hover:bg-zinc-700 hover:border-white/15
                 text-zinc-300 hover:text-zinc-100 text-sm font-medium transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
          </svg>
          <span id="ftpCopyBtnLabel">複製給 AI</span>
        </button>
      </div>

      <!-- 說明 tooltip -->
      <div class="relative group ml-auto">
        <div class="w-5 h-5 rounded-full bg-zinc-800 border border-white/10 flex items-center justify-center cursor-help text-zinc-400 text-[10px] font-bold hover:border-white/20 hover:text-zinc-300 transition-colors">?</div>
        <div class="absolute right-0 bottom-7 w-72 bg-zinc-900 border border-white/10 rounded-xl px-4 py-3 text-xs text-zinc-300 leading-relaxed shadow-2xl shadow-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-50">
          <div class="space-y-2.5">
            <div>
              <p class="font-semibold text-zinc-100 mb-0.5">MMP 近似模型</p>
              <p class="text-zinc-300">從近 90 天有功率計的 15–40 分鐘騎乘中，找出最高 NP，套用換算係數（20min × 0.95、30min × 0.97）推算 FTP。</p>
            </div>
            <div class="border-t border-white/8 pt-2.5">
              <p class="font-semibold text-zinc-100 mb-0.5">物理逆推模型</p>
              <p class="text-zinc-300">指定活動與路段，逆推出「跑出該成績所需的 FTP」，排除設備誤差。</p>
            </div>
            <div class="border-t border-white/8 pt-2.5">
              <p class="font-semibold text-zinc-100 mb-0.5">加權合成</p>
              <p class="text-zinc-300">兩模型均有結果時：<span class="font-mono text-orange-400">MMP × 60% + 物理 × 40%</span></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 錯誤訊息（取代 alert） -->
    <div id="ftpErrorMsg" class="hidden border-t border-white/6 px-5 py-2.5 bg-rose-500/5">
      <p id="ftpErrorText" class="text-xs text-rose-400"></p>
    </div>

  </div>
</div>
