<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}VeloData | 數據監控{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans">
    <div class="max-w-4xl mx-auto py-10 px-6">
      {% include 'partials/_header.html' %}
      {% include 'partials/_nav_tabs.html' %}
      <main id="content">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/copy_for_ai.js') }}"></script>
    {% block scripts %}{% endblock %}
    <script>
      document.body.addEventListener('htmx:beforeRequest', function (e) {
        var target = e.detail.target;
        if (!target || target.id !== 'content') return;
        target.innerHTML =
          '<div class="animate-pulse space-y-4 py-2">' +
            '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">' +
              '<div class="h-32 bg-slate-800 rounded-xl"></div>' +
              '<div class="h-32 bg-slate-800 rounded-xl"></div>' +
            '</div>' +
            '<div class="h-20 bg-slate-800 rounded-xl"></div>' +
            '<div class="h-72 bg-slate-800 rounded-xl"></div>' +
            '<div class="h-48 bg-slate-800 rounded-xl"></div>' +
          '</div>';
      });
    </script>
  </body>
</html>
