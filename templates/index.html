<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>VeloData | 數據監控</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans">
    <div class="max-w-4xl mx-auto py-10 px-6">
      <header class="mb-10 flex justify-between items-end">
        <div>
          <h1 class="text-4xl font-black text-orange-500 tracking-tighter">
            VeloData
          </h1>
          <p class="text-slate-400">防止資科被當的單車數據外掛</p>
        </div>
        <div class="flex items-center gap-3">
          {% if athlete.profile %}
          <img
            src="{{ athlete.profile }}"
            alt="{{ athlete.firstname }} {{ athlete.lastname }}"
            class="w-10 h-10 rounded-full border-2 border-orange-500 object-cover"
          />
          {% endif %}
          <div class="text-right">
            <div class="text-slate-200 font-semibold leading-tight">
              {{ athlete.firstname }} {{ athlete.lastname }}
            </div>
            <span class="text-xs text-green-400">已連線 Strava</span>
          </div>
        </div>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
        <div
          class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl"
        >
          <h3 class="text-slate-400 text-sm mb-2">當前狀態</h3>
          <p class="text-3xl font-bold text-green-400">體能恢復中</p>
        </div>
        <div
          class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl"
        >
          <h3 class="text-slate-400 text-sm mb-2">本週 TSS 累積</h3>
          <p class="text-3xl font-bold text-blue-400">245 / 500</p>
        </div>
      </div>

      <h2 class="text-xl font-bold mb-4 px-2 text-slate-300">最近騎乘資料</h2>
      <div class="space-y-4">
        {% for act in activities %}
        <div
          class="bg-slate-900/50 p-4 rounded-xl border border-slate-800 flex justify-between items-center hover:bg-slate-800 transition"
        >
          <div>
            <div class="font-bold text-lg text-slate-200">{{ act.name }}</div>
            <div class="text-xs text-slate-500">{{ act.start_date_local }}</div>
          </div>
          <div class="text-right">
            <div class="text-orange-400 font-mono font-bold text-xl">
              {{ act.average_watts }} W
            </div>
            <div class="text-xs text-slate-500">平均功率</div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </body>
</html>
