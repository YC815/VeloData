<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>VeloData | 連結 Strava</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans flex items-center justify-center min-h-screen">
    <div class="text-center px-6">
      <h1 class="text-5xl font-black text-orange-500 tracking-tighter mb-2">VeloData</h1>
      <p class="text-zinc-400 mb-10">防止資科被當的單車數據外掛</p>

      {% if error %}
      <div class="bg-red-950/60 border border-red-800/50 text-red-300 text-sm rounded-xl px-5 py-3 mb-6">
        {{ error }}
      </div>
      {% endif %}

      <a
        href="/auth"
        class="inline-flex items-center gap-3 bg-orange-500 hover:bg-orange-400 active:bg-orange-600 text-white font-bold px-8 py-4 rounded-2xl text-lg transition"
      >
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.172"/>
        </svg>
        連結 Strava 帳號
      </a>

      <p class="text-zinc-600 text-xs mt-6">
        授權後 refresh token 會自動存入 .env，下次開啟不需重新登入。
      </p>
    </div>
  </body>
</html>
